version: '3.8'

services:
  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"    # 컨테이너 내부용 포트(내부 서비스들이 kafka:9092로 접속)
      - "29092:29092"  # 호스트에서 localhost:29092로 접속
    environment:
      - ALLOW_PLAINTEXT_LISTENER=yes

      # KRaft 필수 설정
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093 # 단일 노드 (개발용)
#      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka-0:9093,1@kafka-1:9093,2@kafka-2:9093 # 노드 3

      # 리스너 설정 (컨트롤러/브로커/호스트)
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT

      # 클러스터 ID (반드시 22자 base64/UUID 포맷; 아래 명령으로 생성)
      - KAFKA_KRAFT_CLUSTER_ID= ${KAFKA_KRAFT_CLUSTER_ID}

#      # 개발용 기본값(운영에서는 조정)
#      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=false
#      - KAFKA_CFG_NUM_PARTITIONS=3
#      - KAFKA_CFG_DEFAULT_REPLICATION_FACTOR=3
#      - KAFKA_CFG_MIN_INSYNC_REPLICAS=2
    volumes:
      - kafka_data:/bitnami/kafka

  execution-service:
    build: .
    container_name: execution-service
    ports:
      - "8083:8083"
    depends_on:
      - kafka
    env_file:
      - ./.env

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      - kafka

volumes:
  kafka_data: