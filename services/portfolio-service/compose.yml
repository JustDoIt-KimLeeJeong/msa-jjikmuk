services:
  kafka:
    image: apache/kafka:latest   # ✅ Apache 공식 이미지
    container_name: pf-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_BROKER_PORT}:29092"  # 호스트(19092) -> 컨테이너(EXTERNAL 29092)
      - "${KAFKA_CONTROLLER_PORT}:9093"
    environment:
      # KRaft (컨트롤러+브로커 겸임: 로컬 개발용)
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 내부/외부 듀얼 리스너
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_BROKER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 로그 디렉토리(포맷 타겟)
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Topic 복제 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pf-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: portfolio-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ============================================
  # PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-0000}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: pf-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Portfolio Consumer (Kafka Event Handler)
  # ============================================
  portfolio-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pf-consumer
    restart: unless-stopped
    environment:
      # Database
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-0000}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Kafka (내부 통신용)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: portfolio-service
      
      # Topic
      KAFKA_TOPIC_PORTFOLIO: portfolio

      # Topic 복제 
      
      
      # 기타
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # command: python -m adapters.inbound.events.consumer
    command: faststream run interfaces.kafka_app:kafka_app
    volumes:
      - .:/app  # 개발 시 hot reload