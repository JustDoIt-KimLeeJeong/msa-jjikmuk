services:
  kafka:
    image: apache/kafka:latest   # ✅ Apache 공식 이미지
    container_name: pf-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_BROKER_PORT}:29092"  # 호스트(19092) -> 컨테이너(EXTERNAL 29092)
      - "${KAFKA_CONTROLLER_PORT}:9093"
    environment:
      # KRaft (컨트롤러+브로커 겸임: 로컬 개발용)
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 내부/외부 듀얼 리스너
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_BROKER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 로그 디렉토리(포맷 타겟)
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Topic 복제 
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
  

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: pf-kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: portfolio-dev
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # ============================================
  # PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: pf-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-0000}
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    

  # ============================================
  # Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: pf-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Portfolio Consumer (Kafka Event Handler)
  # ============================================
  portfolio-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pf-consumer
    restart: unless-stopped
    environment:
      # Database
      PG_HOST: ${PG_HOST:-postgres}  # .env에 없으면 postgres 사용
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-0000}
      PG_DB_NAME: ${PG_DB_NAME:-portfolio}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      
      # Kafka (내부 통신용)
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP_ID: portfolio-service
      
      # Topic
      KAFKA_TOPIC_PORTFOLIO: portfolio

      # Topic 복제 
      
      
      # 기타
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # command: python -m adapters.inbound.events.consumer
    command: faststream run interfaces.kafka_app:kafka_app --reload
    volumes:
      - .:/app  # 개발 시 hot reload

  kafka-connect:
    image: quay.io/debezium/connect:3.0
    container_name: kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Debezium 커넥터 자동 등록
  # Debezium 커넥터 자동 등록
  debezium-setup:
    image: alpine:latest
    container_name: debezium-setup
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./debezium_connector.json:/debezium_connector.json:ro
    command: >
      sh -c '
        apk add --no-cache curl jq
        
        echo "⏳ Waiting for Kafka Connect to be fully ready..."
        sleep 10
        
        echo "📝 Checking existing connectors..."
        EXISTING=$$(curl -s http://kafka-connect:8083/connectors)
        echo "$$EXISTING"
        
        CONNECTOR_NAME=$$(jq -r ".name" /debezium_connector.json)
        
        if echo "$$EXISTING" | grep -q "$$CONNECTOR_NAME"; then
          echo "✅ Connector $$CONNECTOR_NAME already exists!"
          exit 0
        fi
        
        echo "🔌 Registering Debezium connector..."
        HTTP_CODE=$$(curl -s -o /tmp/response.json -w "%{http_code}" \
          -X POST http://kafka-connect:8083/connectors \
          -H "Content-Type: application/json" \
          -d @/debezium_connector.json)
        
        echo "Response code: $$HTTP_CODE"
        cat /tmp/response.json
        echo ""
        
        if [ "$$HTTP_CODE" = "201" ] || [ "$$HTTP_CODE" = "409" ]; then
          echo "✅ Connector registered successfully!"
          exit 0
        else
          echo "❌ Failed to register connector"
          exit 1
        fi
      '
    restart: "no"